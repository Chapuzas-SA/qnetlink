<svg xmlns="http://www.w3.org/2000/svg" width="960" height="465" viewBox="0 0 960 465" role="img" aria-labelledby="title desc">
<title id="title">qnetlink wss-relay.log — dark theme</title>
<desc id="desc">qnetlink client running libslirp connects via WSS TLS to qnetlink server relay, which connects to QEMU over TCP</desc>
<rect x="2" y="2" width="956" height="461" rx="20" fill="#282738" stroke="#56516C" stroke-width="2"/>
