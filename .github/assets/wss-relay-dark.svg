<circle cx="78" cy="30" r="7" fill="#B8DDC5"/>
<text x="480" y="36" fill="#AAA8C2" font-size="16" font-weight="400" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace">wss-relay.log — ~/qnetlink</text>
<text x="38" y="98" fill="#B8DDC5" font-size="17" font-weight="600" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, monospace">$ ./qnetlink --inspect wss</text>
<text x="38" y="131" fill="#AAA8C2" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, monospace">[ REMOTE STREAM / TLS-PROTECTED WEBSOCKET ]</text>
