# Example configuration; the application does not load this file automatically.
# Copy it to qnetlink.ini, edit the values, then pass --config explicitly.

[general]
# Select client or server mode before starting the application.
mode=client
verbose=false
reconnect-ms=1000

[stream]
# QEMU stream peer address and port.
host=127.0.0.1
port=9090

[client]
# Client-side virtual network and transport.
net=10.255.254.0/24
dhcp-start=10.255.254.15
# Choose tcp or wss.
transport=tcp

[wss]
# Used by a WSS client or the WSS server.
path=/
# Testing only: accepting self-signed certificates skips peer verification.
tls-insecure=false

[server]
# Change [general] mode to server and provide matching certificate files.
# Port 443 is privileged on Linux and may require administrator permissions.
listen-host=0.0.0.0
listen-port=443
# Paths are relative to the process working directory.
cert=tls/server.crt
key=tls/server.key
